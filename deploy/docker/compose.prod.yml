services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ASHMES_PUBLIC_HOST: ${ASHMES_PUBLIC_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_started
    networks:
      - ashmes_public
      - ashmes_internal

  frontend:
    build:
      context: ../..
      dockerfile: Frontend/Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - ashmes_internal

  api:
    build:
      context: ../..
      dockerfile: Backend/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__AccessTokenLifetimeMinutes: ${JWT_ACCESS_TOKEN_LIFETIME_MINUTES}
      Jwt__RefreshTokenLifetimeDays: ${JWT_REFRESH_TOKEN_LIFETIME_DAYS}
      Seed__EnableDevelopmentSeed: "false"
      Intelligence__Enabled: ${INTELLIGENCE_ENABLED}
      Intelligence__BaseUrl: http://intelligence:8020
      Intelligence__TimeoutSeconds: "20"
      Intelligence__MaxProductsPerRequest: "1000"
      Intelligence__HotProductsAlgorithm: rule_based_hot_products_v1
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      intelligence:
        condition: service_healthy
    networks:
      - ashmes_internal

  intelligence:
    build:
      context: ../..
      dockerfile: Intelligence/Dockerfile
    restart: unless-stopped
    environment:
      INTELLIGENCE_ENV: production
      INTELLIGENCE_LOG_LEVEL: ${INTELLIGENCE_LOG_LEVEL}
      INTELLIGENCE_API_PREFIX: /api/v1
      INTELLIGENCE_ENABLE_DEBUG: "false"
    expose:
      - "8020"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health/live', timeout=5).read()"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - ashmes_internal

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ashmes_internal

  migrator:
    profiles:
      - tools
    build:
      context: ../..
      dockerfile: Backend/Dockerfile
      target: build
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    volumes:
      - ../../.config:/src/.config:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      /bin/sh -c "dotnet tool restore &&
      dotnet ef database update
      --project Backend/AshmesMarketplaces.DataAccess/AshmesMarketplaces.DataAccess.csproj
      --startup-project Backend/AshmesMarketplaces.API/AshmesMarketplaces.API.csproj"
    networks:
      - ashmes_internal

networks:
  ashmes_public:
  ashmes_internal:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
