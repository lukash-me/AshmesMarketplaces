services:
  api:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    container_name: ashmes-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: ${JWT_ISSUER:-http://localhost:5019}
      Jwt__Audience: ${JWT_AUDIENCE:-http://localhost:5019}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-development-only-auth-foundation-signing-key-change-before-production}
      Jwt__AccessTokenLifetimeMinutes: ${JWT_ACCESS_TOKEN_LIFETIME_MINUTES:-15}
      Jwt__RefreshTokenLifetimeDays: ${JWT_REFRESH_TOKEN_LIFETIME_DAYS:-30}
      Seed__EnableDevelopmentSeed: "true"
      Intelligence__Enabled: ${INTELLIGENCE_ENABLED:-true}
      Intelligence__BaseUrl: http://intelligence:8020
      Intelligence__TimeoutSeconds: "1200"
      Intelligence__MaxProductsPerRequest: "100000"
      Intelligence__HotProductsAlgorithm: rule_based_hot_products_v1
      WorkspaceMarketProductMediaStorage__RootPath: /app/wwwroot/uploads
      WorkspaceMarketProductMediaStorage__PublicBasePath: /uploads
      DataProtection__KeysPath: /app/data-protection-keys
      DataProtection__ApplicationName: AshmesMarketplaces
    ports:
      - "${API_PORT:-5019}:8080"
    volumes:
      - ashmes_uploads:/app/wwwroot/uploads
      - ashmes_data_protection_keys:/app/data-protection-keys
    depends_on:
      postgres:
        condition: service_healthy
      intelligence:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v1/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
    container_name: ashmes-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  analytics-worker:
    build:
      context: .
      dockerfile: Backend/AnalyticsWorker.Dockerfile
    container_name: ashmes-analytics-worker
    environment:
      DOTNET_ENVIRONMENT: Development
      WorkerFeatures__AnalysisRefreshEnabled: "true"
      WorkerFeatures__ParserBatchProcessingEnabled: "true"
      WorkerFeatures__ParserLaunchEnabled: "false"
      WorkerFeatures__ParserLogMonitoringEnabled: "true"
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Intelligence__Enabled: ${INTELLIGENCE_ENABLED:-true}
      Intelligence__BaseUrl: http://intelligence:8020
      Intelligence__TimeoutSeconds: "1200"
      Intelligence__MaxProductsPerRequest: "100000"
      Intelligence__HotProductsAlgorithm: rule_based_hot_products_v1
      ParserMonitoring__LogRoot: /parser-data/output/outbox/_runtime/logs
      ParserMonitoring__StaleAfterSeconds: "210"
    volumes:
      - ashmes_parser_output:/parser-data/output
    depends_on:
      postgres:
        condition: service_healthy
      intelligence:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  parser-launcher:
    build:
      context: .
      dockerfile: Backend/ParserLauncher.Dockerfile
    container_name: ashmes-parser-launcher
    environment:
      DOTNET_ENVIRONMENT: Development
      WorkerFeatures__AnalysisRefreshEnabled: "false"
      WorkerFeatures__ParserBatchProcessingEnabled: "false"
      WorkerFeatures__ParserLaunchEnabled: "true"
      WorkerFeatures__ParserLogMonitoringEnabled: "false"
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Intelligence__Enabled: "false"
      ParserLaunch__WorkingDirectory: /workspace
      ParserLaunch__PythonExecutable: /opt/ashmes-parser-venv/bin/python
      ParserLaunch__SupervisorScriptPath: /workspace/Parser/app/proxy_supervisor.py
      ParserLaunch__ConfigPath: /workspace/Parser/presets/production/market_refresh_service_runtime.prod.json
      ParserLaunch__OutboxRoot: /parser-data/output/outbox
      ParserLaunch__OutputBaseDir: /parser-data/output
      ParserLaunch__RateLimitStateDir: /parser-data/output/rate_limits
      ParserLaunch__BatchQueueUrl: http://api:8080/api/v1/parser
      ParserLaunch__RequireServiceRuntime: "true"
      DataProtection__KeysPath: /app/data-protection-keys
      DataProtection__ApplicationName: AshmesMarketplaces
      PARSER_BATCH_QUEUE_URL: http://api:8080/api/v1/parser
      PARSER_OUTPUT_BASE_DIR: /parser-data/output
      PARSER_RATE_LIMIT_STATE_DIR: /parser-data/output/rate_limits
    volumes:
      - ashmes_parser_output:/parser-data/output
      - ashmes_data_protection_keys:/app/data-protection-keys
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: ashmes-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ashmes_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ashmes-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - ashmes_pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: ashmes-redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ashmes_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: ashmes-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - ashmes_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  intelligence:
    build:
      context: .
      dockerfile: Intelligence/Dockerfile
    container_name: ashmes-intelligence
    environment:
      INTELLIGENCE_ENV: development
      INTELLIGENCE_API_PREFIX: /api/v1
      INTELLIGENCE_ENABLE_DEBUG: "false"
      INTELLIGENCE_TOP_FORECAST_MODEL_DIR: /app/data/top_forecast_models
    ports:
      - "${INTELLIGENCE_PORT:-8020}:8020"
    volumes:
      - ashmes_intelligence_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health/live', timeout=5).read()"
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  migrator:
    profiles:
      - tools
    build:
      context: .
      dockerfile: Backend/Dockerfile
      target: build
    container_name: ashmes-migrator
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    volumes:
      - ./.config:/src/.config:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      /bin/sh -c "dotnet tool restore &&
      dotnet ef database update
      --project Backend/AshmesMarketplaces.DataAccess/AshmesMarketplaces.DataAccess.csproj
      --startup-project Backend/AshmesMarketplaces.API/AshmesMarketplaces.API.csproj"
    restart: "no"

volumes:
  ashmes_uploads:
  ashmes_postgres_data:
  ashmes_pgadmin_data:
  ashmes_redis_data:
  ashmes_minio_data:
  ashmes_intelligence_data:
  ashmes_parser_output:
  ashmes_data_protection_keys:
